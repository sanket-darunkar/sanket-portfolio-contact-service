spring:
  application:
    name: contact-service

server:
  # Render injects PORT; SERVER_PORT is kept as a secondary override for other platforms.
  port: ${PORT:${SERVER_PORT:8080}}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Logging — INFO in production; local profile overrides to DEBUG
logging:
  level:
    dev.sanket.contactservice: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# App-specific configuration (secrets injected via environment variables)
app:
  cors:
    # Comma-separated list of allowed origins.
    # On Render, set CORS_ALLOWED_ORIGINS to the exact frontend origin(s), e.g.:
    #   CORS_ALLOWED_ORIGINS=https://developer-platform-inky.vercel.app
    # Multiple origins: CORS_ALLOWED_ORIGINS=https://example.com,http://localhost:3000
    # The default covers the production Vercel deployment and local dev.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://developer-platform-inky.vercel.app,http://localhost:3000,http://localhost:5173}

  resend:
    # Resend HTTP Email API credentials — injected via environment variables, never hardcoded.
    # Set RESEND_API_KEY on Render (already configured).
    # Set RESEND_FROM_EMAIL to your verified sender, e.g. onboarding@resend.dev for testing.
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

  contact:
    recipient-email: ${CONTACT_RECIPIENT_EMAIL:}
